# Where are all the schema files located? globs are supported eg  src/**/*.graphql
schema:
  - schema.graphql

# Where should any generated models go?
model:
  filename: graph/model/models_gen.go
  package: model

omit_slice_element_pointers: true

# we don't use generated.go and it causes mod.tidy to change go.mod it is included
exec:
  filename: _tmp/generated.go

models:
  Money:
    model:
      - ./graphql.Money
  Decimal:
    model:
      - ./graphql.Decimal
