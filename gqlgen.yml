# Where are all the schema files located? globs are supported eg  src/**/*.graphql
schema:
  - schema.graphql

# Where should any generated models go?
model:
  filename: graph/model/models_gen.go
  package: model

omit_slice_element_pointers: true

# Newer gqlgen adds MarshalJSON/UnmarshalJSON to enums. That makes a JSON null
# in a non-pointer enum field a decode error instead of a no-op, so keep the
# plain string behaviour that encoding/json gives us.
omit_enum_json_marshalers: true

# We don't use generated.go, and it causes `go mod tidy` to change go.mod if it is included.
exec:
  filename: _tmp/generated.go

models:
  Money:
    model:
      - ./graphql.Money
  Decimal:
    model:
      - ./graphql.Decimal
